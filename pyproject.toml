[project]
name = "brigse"
version = "0.1.0"
description = "Modular MCP server for FPGA build, report, simulation and programming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
brigse = "brigse.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brigse"]
