[project]
name = "brigse"
version = "0.1.0"
description = "Modular MCP server for FPGA build, report, simulation and programming"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
png = ["pillow>=10"]

[project.scripts]
brigse = "brigse.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_scripts.py"]   # the other test_*.py are standalone scripts, run by test_scripts.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brigse"]
